load_module modules/ngx_http_geoip2_module.so;

events { 
    worker_connections 1024; 
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 1. REAL_IP
    set_real_ip_from 0.0.0.0/0;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # 2. Лог
    log_format balancer_log '$remote_addr [$time_local] '
                            'City: "$geoip2_data_city_name" '
                            'Region: "$geoip2_data_region" '
                            'Chosen_Pool: "$backend_pool"';

    # 3. GeoIP2
    geoip2 /usr/share/GeoIP/GeoLite2-City.mmdb {
        auto_reload 5m;
        $geoip2_data_city_name default=Unknown source=$remote_addr city names en;
        $geoip2_data_region    default=Unknown source=$remote_addr subdivisions 0 iso_code;
    }

    # ============================================================
    # 4. ЛОГИКА ВЫБОРА
    # ============================================================

    map $geoip2_data_city_name $backend_pool {
        "Chelyabinsk" stage_pool;  # Если город Челябинск, отправляем на стейдж
        default       prod_pool;   # Все остальные города и страны — на прод
    }


    # ============================================================
    # 5. Подмена заголовка Host для апстримов
    # ============================================================
    map $backend_pool $proxy_host_header {
        prod_pool           prod-simple.ru;
        stage_pool          stage-simple.ru;
        default             $host;
    }

    # ============================================================
    # 6. Upstream'ы (Названия приведены в строгое соответствие с map)
    # ============================================================
    upstream prod_pool {
        # Замените на реальный внутренний IP или домен продакшн-сервера
        server 10.0.0.1:80 max_fails=3 fail_timeout=10s;
    }

    upstream stage_pool {
        # Замените на реальный внутренний IP или домен стейдж-сервера
        server 10.0.0.2:80 max_fails=3 fail_timeout=10s;
    }

    # 7. HTTP -> HTTPS редирект
    server {
        listen 80;
        server_name www.prod-simple.ru prod-simple.ru;
        return 301 https://$host:8443$request_uri;
    }

    # 8. Основной виртуальный сервер
    server {
        listen 443 ssl;
        server_name www.prod-simple.ru prod-simple.ru;

        # Пути к сертификатам (для репозитория можно оставить стандартные)
        ssl_certificate     /etc/nginx/ssl/cert.crt;
        ssl_certificate_key /etc/nginx/ssl/cert.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        access_log /var/log/nginx/balancer_access.log balancer_log;

        location / {
            proxy_pass http://$backend_pool;
            proxy_set_header Host              $proxy_host_header;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }
    }
}

